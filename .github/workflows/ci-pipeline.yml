name: CI Pipeline

on: [ push, pull_request ]

env:
  # See the outputs of https://github.com/KraftSQL/kraftsql-bigquery-itest-infrastructure:
  WORKLOAD_IDENTITY_PROVIDER: projects/505445121169/locations/global/workloadIdentityPools/github-actions/providers/github-actions-oidc
  INTEGRATION_TEST_SERVICE_ACCOUNT: bigquery-connector-itest@kraftsql-bigquery.iam.gserviceaccount.com
  INTEGRATION_TEST_PROJECT: kraftsql-bigquery
  INTEGRATION_TEST_LOCATION: europe-west4

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write # to authenticate at GCP for the integration tests
    outputs:
      version: ${{ steps.provide_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # for sonar
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: 'zulu'
          java-version: '25'
      # Only on pushes: PRs from forks can't authenticate, and PRs from this repository are covered by the push.
      - if: github.event_name == 'push'
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.INTEGRATION_TEST_SERVICE_ACCOUNT }}
          project_id: ${{ env.INTEGRATION_TEST_PROJECT }}
      - name: Build and check
        uses: christopherfrieler/gradle-wrapper-action@v0.7.6
        env:
          ORG_GRADLE_PROJECT_github_packages_user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_github_packages_password: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_DEFAULT_BRANCH_NAME: ${{ github.event.repository.default_branch }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          KRAFTSQL_BIGQUERY_LOCATION: ${{ env.INTEGRATION_TEST_LOCATION }}
          KRAFTSQL_REFERENCE_TEST_NAMESPACE: ci_${{ github.run_id }}_${{ github.run_attempt }}
        with:
          arguments: |
            check sonar ${{ case(github.event_name == 'push', '', '-x integrationTest') }}
            assemble generatePomFileForMavenPublication kotlinSourcesJar dokkaJavadocJar
            versionFile
          artifacts: |
            bq-connector-build kraftsql-bigquery/build/publications/maven/pom-default.xml kraftsql-bigquery/build/libs/kraftsql-bigquery-*.jar
            bq-connector-test-report kraftsql-bigquery/build/reports/tests/test/**/*
            ${{ case(github.event_name == 'push', 'bq-connector-integration-test-report kraftsql-bigquery/build/reports/tests/integrationTest/**/*', '') }}
      - id: provide_version
        run: echo "version=$(cat build/version.txt)" >> "$GITHUB_OUTPUT"

  deploy_snapshot:
    needs: ['build']
    if: github.ref_name == github.event.repository.default_branch && endsWith(needs.build.outputs.version, '-SNAPSHOT')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: 'zulu'
          java-version: '25'
      - name: Deploy to Github Packages
        uses: christopherfrieler/gradle-wrapper-action@v0.7.6
        env:
          ORG_GRADLE_PROJECT_github_packages_user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_github_packages_password: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_github_packages_publishing_user: ${{ github.actor }}
          ORG_GRADLE_PROJECT_github_packages_publishing_password: ${{ secrets.GITHUB_TOKEN }}
        with:
          arguments: publishMavenPublicationToGitHubPackagesRepository
  deploy:
    needs: ['build']
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: 'zulu'
          java-version: '25'
      - name: Deploy to Maven Central
        uses: christopherfrieler/gradle-wrapper-action@v0.7.6
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_PASSWORD }}
        with:
          arguments: publishMavenPublicationToMavenCentralRepository
